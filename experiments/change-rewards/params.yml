protocol:
  episodes: 100
  iterations: 10
  seeds:
  - 0
  - 1
  - 2
  lut_inputs: 6
  initial_sequence:
  - strash
  resyn2:
  - balance
  - rewrite
  - refactor
  - balance
  - rewrite
  - rewrite -z
  - balance
  - refactor -z
  - rewrite -z
  - balance
  actions:
  - rewrite
  - rewrite -z
  - refactor
  - refactor -z
  - resub
  - resub -z
  - balance
  circuits:
    int2float:
      file: ../../benchmarks/int2float.aig
      max_levels: 3
    i2c:
      file: ../../benchmarks/i2c.aig
      max_levels: 4
    max:
      file: ../../benchmarks/max.aig
      max_levels: 41
  evaluation:
    include_initial: true
    std_ddof: 0
method:
  gamma: 0.99
  optimizer:
    name: Adam
    learning_rate: 0.001
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-08
    weight_decay: 0.0
  network:
    actor_hidden:
    - 20
    - 20
    critic_hidden:
    - 10
    activation: ReLU
    initialization: xavier_uniform
    bias_initialization: 0.0
  features:
  - input_pins
  - output_pins
  - cells
  - edges
  - levels
  - latches
  - and_fraction
  - or_fraction
  - not_fraction
  normalization:
    state: episode_welford
    variance_min: 0.01
    variance_max: 1000000000.0
    returns: standardize
    returns_epsilon: 1.0e-08
  loss:
    actor_weight: 1.0
    critic_weight: 1.0
    reduction: sum
  reward:
    feasible_mode: normalized_delta
    feasible_scale: 1.0
    feasible:
      -1: -1
      0: 0
      1: 3
    infeasible:
      -1:
        -1: -3
        0: -2
        1: -1
      0:
        -1: -2
        0: 0
        1: 2
      1:
        -1: 1
        0: 2
        1: 3
environment:
  torch_threads: 1
runtime:
  abc_binary: ../../.tools/conda-env/bin/yosys-abc
  yosys_binary: ../../.tools/conda-env/bin/yosys
  output_dir: ../../results/change-rewards
  workers: 3
